[project]
name = "aura-api"
version = "0.1.0"
description = "Tenant onboarding and lifecycle service for the Aura OpenStack platform."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "openstacksdk>=4.0",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aura_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "S",            # bandit
    "C4",           # comprehensions
    "SIM",          # simplify
    "RET",          # return
    "PT",           # pytest style
    "RUF",          # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openstack.*", "keystoneauth1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=aura_api",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
