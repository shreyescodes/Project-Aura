groups:
  - name: aura.ceph
    rules:
      # ceph_health_status: 0 = HEALTH_OK, 1 = HEALTH_WARN, 2 = HEALTH_ERR
      - alert: CephHealthError
        expr: ceph_health_status == 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Ceph cluster is in HEALTH_ERR."
          runbook_url: https://github.com/shreyescodes/Project-Aura/blob/main/docs/runbooks/ceph.md#cephhealtherror

      - alert: CephHealthWarning
        expr: ceph_health_status == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Ceph cluster has been in HEALTH_WARN for 30 minutes."
          runbook_url: https://github.com/shreyescodes/Project-Aura/blob/main/docs/runbooks/ceph.md#cephhealthwarning

      - alert: CephOSDDown
        expr: ceph_osd_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ceph_daemon }} is down."
          runbook_url: https://github.com/shreyescodes/Project-Aura/blob/main/docs/runbooks/ceph.md#cephosddown

      - alert: CephMonitorOutOfQuorum
        expr: ceph_mon_quorum_status == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.ceph_daemon }} is out of quorum."
          runbook_url: https://github.com/shreyescodes/Project-Aura/blob/main/docs/runbooks/ceph.md#cephmonitoroutofquorum

      # Ceph's own nearfull ratio is 85%; warn early enough to add capacity.
      - alert: CephClusterNearFull
        expr: ceph_cluster_total_used_bytes / ceph_cluster_total_bytes > 0.75
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Ceph raw capacity is {{ $value | humanizePercentage }} used."
          runbook_url: https://github.com/shreyescodes/Project-Aura/blob/main/docs/runbooks/ceph.md#cephclusternearfull
