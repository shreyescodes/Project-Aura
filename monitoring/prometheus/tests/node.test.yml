rule_files:
  - ../rules/node.rules.yml

evaluation_interval: 1m

tests:
  - name: Clock skew beyond 50ms
    interval: 1m
    input_series:
      - series: 'node_timex_offset_seconds{instance="ceph-2:9100", job="node"}'
        values: "0 -0.2x15"
    alert_rule_test:
      - eval_time: 12m
        alertname: NodeClockSkew
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: ceph-2:9100
              job: node
            exp_annotations:
              summary: "Clock on ceph-2:9100 is 200ms off."
              runbook_url: https://github.com/shreyescodes/Project-Aura/blob/main/docs/runbooks/node-health.md#nodeclockskew

  - name: Read-only filesystems are not reported as full
    interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="compute-0:9100", job="node", fstype="ext4", mountpoint="/snap/core"}'
        values: "0x20"
      - series: 'node_filesystem_size_bytes{instance="compute-0:9100", job="node", fstype="ext4", mountpoint="/snap/core"}'
        values: "100x20"
      - series: 'node_filesystem_readonly{instance="compute-0:9100", job="node", fstype="ext4", mountpoint="/snap/core"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeFilesystemAlmostFull
        exp_alerts: []
