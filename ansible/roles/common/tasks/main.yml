---
- name: Assert the operating system is supported
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] in common_supported_distributions
      - ansible_facts['distribution_version'] in common_supported_distributions[ansible_facts['distribution']]
    fail_msg: >-
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} is not supported.
      Supported: {{ common_supported_distributions }}
    quiet: true

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove the loopback mapping of the hostname
  # Kolla prechecks fail if the hostname resolves to 127.0.1.1 instead of the
  # management address.
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    state: absent

- name: Publish platform hosts in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} AURA MANAGED HOSTS"
    block: "{{ lookup('ansible.builtin.template', 'hosts.j2') }}"

- name: Configure time synchronisation
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable chrony
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true

- name: Apply kernel tuning
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-aura.conf
    state: present
    reload: true
  loop: "{{ common_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Harden the SSH daemon
  # sshd keeps the first value it reads, and Ubuntu cloud images ship
  # 60-cloudimg-settings.conf, so this drop-in sorts ahead of it.
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-aura-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
