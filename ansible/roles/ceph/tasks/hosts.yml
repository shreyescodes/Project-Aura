---
- name: Read the orchestrator's SSH public key
  ansible.builtin.slurp:
    src: /etc/ceph/ceph.pub
  register: ceph_orchestrator_pubkey

- name: Authorise the orchestrator on every storage node
  ansible.posix.authorized_key:
    user: "{{ ceph_ssh_user }}"
    key: "{{ ceph_orchestrator_pubkey['content'] | b64decode }}"
    state: present
  delegate_to: "{{ item }}"
  loop: "{{ groups['ceph'] }}"

- name: List hosts known to the orchestrator
  ansible.builtin.command:
    argv: [ceph, orch, host, ls, --format, json]
  register: ceph_orch_hosts
  changed_when: false

- name: Index orchestrator hosts by name
  ansible.builtin.set_fact:
    ceph_orch_host_labels: "{{ ceph_orch_hosts['stdout'] | from_json | items2dict(key_name='hostname', value_name='labels') }}"

- name: Add storage nodes to the orchestrator
  ansible.builtin.command:
    argv: [ceph, orch, host, add, "{{ item }}", "{{ hostvars[item]['aura_addresses']['storage'] }}"]
  changed_when: true
  loop: "{{ groups['ceph'] | difference(ceph_orch_host_labels.keys() | list) }}"

- name: Label storage nodes
  ansible.builtin.command:
    argv: [ceph, orch, host, label, add, "{{ item[0] }}", "{{ item[1] }}"]
  changed_when: true
  loop: "{{ groups['ceph'] | product(ceph_host_labels) | list }}"
  loop_control:
    label: "{{ item[0] }}: {{ item[1] }}"
  when: item[1] not in ceph_orch_host_labels.get(item[0], [])
