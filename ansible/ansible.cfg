[defaults]
inventory = inventories/lab
roles_path = roles
collections_path = collections
callback_result_format = yaml
forks = 20
timeout = 30
retry_files_enabled = False
interpreter_python = /usr/bin/python3

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
# Lab VMs are rebuilt often and reuse their IPs. Trust new hosts on first contact
# but still reject a changed key. Keys are kept in a project-local file that
# `make infra-apply` resets.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.known_hosts
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
