extends: default

ignore: |
  api/.venv/
  ansible/collections/
  ansible/inventories/*/hosts.yml
  terraform/**/.terraform/

rules:
  line-length:
    max: 160
  # GitHub Actions uses a bare `on:` key.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  # Ansible files start with `---`; Prometheus rule files conventionally don't.
  document-start: disable
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
